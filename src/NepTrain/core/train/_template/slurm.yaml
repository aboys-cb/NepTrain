execution:
  poll_interval: 30
  routes:
    training: training
    sampling: cpu
    labeling: dft
    analysis: cpu
  targets:
    training:
      executor: slurm
      partition: gpu
      time: "24:00:00"
      gpus_per_node: 1
      # setup_script: ./env-training.sh
    cpu:
      executor: slurm
      partition: cpu
      time: "04:00:00"
      cpus_per_task: 4
      # setup_script: ./env-cpu.sh
    dft:
      executor: slurm
      partition: cpu
      time: "24:00:00"
      cpus_per_task: 4
      # setup_script: ./env-dft.sh

schema_version: 3
version: 0
dft_job: 10
md_split_job: temperature
work_path: ./cache
current_job: training
generation: 1
init_train_xyz: ./train.xyz
init_nep_txt: ./nep.txt

training:
  backend: gpumd
  initial_path: ./train.xyz
  device: cuda
  torch_backend: auto
  precision: float32
  use_compile: false
  restart: true
  restart_steps: 20000
  config_path: ./nep.in
  test_path: null

md:
  backend: gpumd
  inference_backend: auto
  duration_ps_every_generation: [10, 100, 500, 1000]
  temperatures: [50, 100, 150, 200, 250, 300]
  structures: ./structure
  template_path: ./run.in
  ensemble: nvt
  timestep: 0.001
  pressure: 0.0
  dump_interval: 100
  spin: false
  spin_temperature: null
  spin_alpha: 0.01
  spin_seed: 12345
  midpoint_iter: 3
  lmp: lmp
  mpiexec: mpirun
  mpi_ranks: 1
  plugin_path: null
  # Failed LAMMPS runs retain two boundary frames; the final frame is quarantined.
  pre_failure_frames: 2
  bad_tail_frames: 1
  health:
    min_distance_ratio: 0.5
    min_volume_ratio: 0.5
    max_volume_ratio: 2.0
    max_force: 100.0
    max_mforce: 100.0
    max_spin_magnitude: 20.0

dft:
  software: vasp
  cpu_core: 1
  kpoints_use_gamma: true
  incar_path: auto
  resource_path: null
  use_k_stype: kspacing
  kpoints: [20, 20, 20]
  kspacing: 0.2

evaluation:
  # Campaign acceptance must use data that are not merged into training.
  validation_path: ./validation.xyz
  inference_backend: auto
  # Fill these before starting a campaign; empty thresholds are rejected.
  max_rmse: {}

campaign:
  id: ordinary-v1
  generations: 3
  seed: 20260721
  initial_candidates: 200
  dft_budget: 20
  minimum_dft_budget: 8
  initial_steps: 10000
  temperatures: [300, 500, 700]
  frame_stride: 2
  maturity:
    # Defaults are initial_steps multiplied by 1, 4, 16, and 64.
    enabled: true
    levels:
      smoke_passed: 10000
      short_stable: 40000
      long_stable: 160000
      production_ready: 640000

execution:
  poll_interval: 30
  routes:
    training: local
    sampling: local
    labeling: local
    analysis: local
  targets:
    local:
      executor: process

select:
  max_selected: 50
  min_distance: 0.01
  filter: 0.6

limit:
  force: 20

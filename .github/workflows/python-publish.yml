name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    name: Build and verify release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" build twine
      - name: Run tests
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: |
          rm -rf build dist ./*.egg-info ./src/*.egg-info
          python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify installed wheel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m venv "$RUNNER_TEMP/neptrain-release"
          release_python="$RUNNER_TEMP/neptrain-release/bin/python"
          release_cli="$RUNNER_TEMP/neptrain-release/bin/neptrain"
          "$release_python" -m pip install --upgrade pip
          "$release_python" -m pip install dist/*.whl
          "$release_python" -m pip check
          package_version="$("$release_python" -c 'from importlib.metadata import version; print(version("NepTrain"))')"
          test "$RELEASE_TAG" = "v$package_version"
          "$release_cli" --version
          "$release_cli" --help
          "$release_cli" smoke --profile ordinary --output "$RUNNER_TEMP/neptrain-smoke"
      - name: Store release distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish release to PyPI
    needs: release-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/NepTrain
    permissions:
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Publish release distributions
        uses: pypa/gh-action-pypi-publish@release/v1

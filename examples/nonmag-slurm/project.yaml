schema_version: 7

training:
  backend: torchnep
  initial_path: ./train.xyz
  config_path: ./nep.in
  device: cuda

md:
  backend: lammps
  inference_backend: auto
  spin: false

sampling:
  routes:
    - id: default
      structures:
        - ./structures
      template_path: ./lammps.in
      conditions:
        temperature_path:
          - 300
          - 500
          - 700
        production_temperatures:
          - 300
          - 700
        pressure: 0.0
      progression:
        steps:
          smoke_passed: 10000
          short_stable: 40000
          long_stable: 160000
          production_ready: 640000
        replicas:
          smoke_passed: 1
          short_stable: 1
          long_stable: 2
          production_ready: 3

  candidate_pool:
    pre_failure_frames: 2
    bad_tail_frames: 1
    health:
      min_distance_ratio: 0.5
      min_volume_ratio: 0.5
      max_volume_ratio: 2.0
      max_force: 100.0
      max_mforce: 100.0
      max_spin_magnitude: 20.0

  selection:
    # Maximum DFT selections per active-model round; the regular floor is 50.
    max_selected: 100
    novelty: auto

dft:
  backend: vasp
  input_path: ./INCAR
  resource_path: /shared/potpaw_PBE
  # Prefer KSPACING/KGAMMA already written in INCAR.
  kpoint_mode: auto

evaluation:
  validation_path: ./validation.xyz
  inference_backend: auto
  max_rmse:
    energy_rmse: 0.05
    force_rmse: 0.20

workflow:
  id: fe-workflow
  max_model_generations: 12
  seed: 20260721

execution:
  poll_interval: 30
  stage_targets:
    training: gpu
    sampling: cpu
    labeling: dft
    analysis: cpu
  sampling_route_targets: {}
  targets:
    gpu:
      executor: slurm
      partition: gpu
      time: 24:00:00
      gpus_per_node: 1
      setup_script: ./env-training.sh
    cpu:
      executor: slurm
      partition: cpu
      time: 04:00:00
      cpus_per_task: 4
      setup_script: ./env-cpu.sh
    dft:
      executor: slurm
      partition: cpu
      time: 24:00:00
      cpus_per_task: 32
      setup_script: ./env-dft.sh
      environment:
        NEPTRAIN_VASP_COMMAND: srun vasp_std
